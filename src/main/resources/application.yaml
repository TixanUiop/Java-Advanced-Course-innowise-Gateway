server:
  port: 8085

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/orders/**

        - id: order-items-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/order-items/**

        - id: items-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/items/**

        - id: user-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/users/**

        - id: payment-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/payment-cards/**

logging:
  level:
    org.springframework.cloud.gateway: debug
    reactor.netty: debug
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: TRACE

jwt:
  secret: ${JWT_SECRET:com-innowise-authentication-service-secret-key}