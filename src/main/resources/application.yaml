server:
  port: 8085

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/orders/**
            - Path=/api/items/**
            - Path=/api/order-items/**

        - id: user-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/users/**
            - Path=/api/v1/payment-cards/**
