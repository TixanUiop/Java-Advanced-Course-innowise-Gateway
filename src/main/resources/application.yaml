
server:
  port: 8085

spring:
  config:
    import: optional:classpath:application.yaml
  application:
    name: gateway
  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**

        - id: order-service
          uri: http://order-service:8082
          predicates:
            - Path=/api/orders/**

        - id: order-items-service
          uri: http://order-service:8082
          predicates:
            - Path=/api/order-items/**

        - id: items-service
          uri: http://order-service:8082
          predicates:
            - Path=/api/items/**

        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/v1/users/**

        - id: payment-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/v1/payment-cards/**

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    feign: DEBUG
    com.innowise: DEBUG

internal:
  key: innowise-secret-internal-key

jwt:
  secret: ${JWT_SECRET:com-innowise-authentication-service-secret-key}

clients:
  auth:
    url-register: http://auth-service:8081/auth/register
    url-delete: http://auth-service:8081/auth/internal/{id}
  user:
    url-create: http://user-service:8080/api/v1/users/create
security:
  public-paths:
    - /auth/login
    - /auth/register
    - /gateway/auth